# Pulse target registry — source of truth, synced to Postgres on boot.
# No secrets here (tokens/passwords live in .env). Every target MUST set `audience: roco | admin`.
# All checks run from core (185.92.183.106). There is no second vantage; the probe/ingest code stays but is unused.
# Check ids: a check with `id: x` is stored as `<target>:x` and is stable. Without `id` it is positional
# (`<target>:<index>:<kind>`): reordering or removing such a check gives it a new id and drops its history (and
# orphans a heartbeat's push token). Give every NEW check an `id`; existing ones keep theirs so history survives.

targets:
  - id: roco-client-portal
    name: client.rocobroker.ir (client portal)
    group: Roco Broker
    audience: roco
    host: 89.46.217.245
    tags: [roco, portal]
    checks:
      - kind: http
        config: { url: "https://client.rocobroker.ir/", keyword: "login" }
      - kind: tls
        config: { host: client.rocobroker.ir, port: 443 }

  - id: roco-main-site
    name: rocobroker.com (main site)
    group: Roco Broker
    audience: roco
    host: 89.46.217.221
    tags: [roco, website]
    checks:
      - kind: http
        config: { url: "https://rocobroker.com/", keyword: "ROCO Broker" }
      - kind: tls
        config: { host: rocobroker.com, port: 443 }
      - kind: dns
        config: { name: rocobroker.com, type: A }

  - id: roco-ir-site
    name: rocobroker.ir
    group: Roco Broker
    audience: roco
    host: 89.46.217.221
    tags: [roco, website]
    checks:
      - kind: http
        config: { url: "https://rocobroker.ir/", keyword: "RocoBroker" }
      - kind: tls
        config: { host: rocobroker.ir, port: 443 }

  - id: roco-blog
    name: blog.rocobroker.com
    group: Roco Broker
    audience: roco
    host: 65.109.215.58
    tags: [roco, website, wordpress]
    checks:
      - kind: http
        config: { url: "https://blog.rocobroker.com/", keyword: "ROCO Broker" }
      - kind: tls
        config: { host: blog.rocobroker.com, port: 443 }
      - kind: json # boots WordPress and needs its DB; a cached homepage can still return 200 with both dead
        id: wp-json
        config: { url: "https://blog.rocobroker.com/wp-json/", assertions: [{ path: "$.name", exists: true }] }

  - id: roco-seo-agents
    name: roco-seo agents
    group: Roco Broker
    audience: roco
    host: 65.109.212.227
    tags: [roco, agents]
    note: |
      TODO (set at the end, once the API is exposed publicly): add http checks for
      GET /health (liveness, 200 if the API responds) and GET /ready (readiness, 200 when DB and queue are ready).
      Base URL not decided: https://scc.rocobroker.com is the Next.js frontend and returns 404 for both.
      One heartbeat per job, so one job dying cannot hide behind the others still pinging. Each job POSTs its own
      push URL after a successful run, and POSTs it with ?status=fail&message=... when it errors (alerts at once).
      A heartbeat only starts counting once its token exists (`pnpm heartbeat create <checkId>`).
    checks:
      - kind: heartbeat # daily 04:15 UTC, grace 25 h
        id: gsc
        config: { grace_s: 90000 }
      - kind: heartbeat # daily 04:45 UTC, grace 25 h
        id: ga4
        config: { grace_s: 90000 }
      - kind: heartbeat # weekly Mon 05:15 UTC, grace 8 d
        id: pagespeed
        config: { grace_s: 691200 }

  - id: roco-email
    name: Roco email (SPF/DKIM/DMARC/MX)
    group: Roco Broker
    audience: roco
    tags: [roco, email]
    note: |
      LiquidWeb + providers. SMTP is not checked: outbound 25/465/587 to mail.rocobroker.com time out from core
      (verified 2026-11-01) and there is no second vantage.
    checks:
      - kind: dns
        config: { name: rocobroker.com, type: TXT, contains: "v=spf1" }
      - kind: dns
        config: { name: _dmarc.rocobroker.com, type: TXT, contains: "v=DMARC1" }
      - kind: dns
        id: mx
        config: { name: rocobroker.com, type: MX, contains: "mail.rocobroker.com" }
      - kind: dns # both selectors were found published on 2026-11-16; drop whichever you no longer send with
        id: dkim-default
        config: { name: default._domainkey.rocobroker.com, type: TXT, contains: "p=" }
      - kind: dns
        id: dkim-k1
        config: { name: k1._domainkey.rocobroker.com, type: TXT, contains: "p=" }

  - id: termspace
    name: termspace.dev
    group: Personal & client projects
    audience: admin
    host: 95.182.96.28
    tags: [personal, nextjs]
    note: |
      Arabic (/ar) is not published yet and English (/en) currently 404s, so neither is checked on purpose.
      Re-add them when they return 200.
    checks:
      - kind: http
        config: { url: "https://termspace.dev/", keyword: "termspace" }
      - kind: http
        config: { url: "https://termspace.dev/fa" }
      - kind: tls
        config: { host: termspace.dev, port: 443 }

  - id: midori-backend
    name: Midori backend (13.140.89.146)
    group: Midori
    audience: admin
    host: 13.140.89.146
    tags: [midori, api]
    note: |
      The game client connects straight to the IP over HTTPS:443 (no DNS, no Cloudflare).
      Let's Encrypt short-lived IP certificate (~6 days), hence warn_days 2 on the tls check.
    checks:
      - kind: json # default assertion: $.status == "ok"
        config: { url: "https://13.140.89.146/health" }
      - kind: tls
        config: { host: 13.140.89.146, port: 443, warn_days: 2 }

  - id: midori-cp
    name: cp.midoripuzzle.com
    group: Midori
    audience: admin
    host: 13.140.89.146
    tags: [midori, admin-panel]
    checks:
      - kind: http
        config: { url: "https://cp.midoripuzzle.com/", keyword: "Midori Control" }
      - kind: tls
        config: { host: cp.midoripuzzle.com, port: 443 }

  - id: midoripuzzle-site
    name: midoripuzzle.com (Vercel)
    group: Midori
    audience: admin
    tags: [midori, website, vercel]
    note: Hosted on Vercel. No tls check; Vercel renews certs and the http check fails on a bad cert anyway.
    checks:
      - kind: http # follows the 308 to www
        config: { url: "https://midoripuzzle.com/", keyword: "Midori" }

  - id: pulse-dashboard
    name: pulse.termspace.dev (this dashboard)
    group: Infrastructure
    audience: admin
    host: 185.92.183.106
    tags: [pulse, self]
    note: |
      Self-monitoring. The watchdog answers "is Pulse alive at all"; these checks catch what it cannot see --
      Caddy, DNS and certificate problems, and an app that starts answering wrong on its own domain.
    checks:
      - kind: json
        id: healthz
        config: { url: "https://pulse.termspace.dev/api/healthz" }
      - kind: tls
        id: tls
        config: { host: pulse.termspace.dev, port: 443 }
