# Pulse target registry — source of truth, synced to Postgres on boot.
# No secrets here (tokens/passwords live in .env). Every target MUST set `audience: roco | admin`.
# URLs/keywords are the starting list from docs/PLAN.md — confirm before Phase 1.
# Vantage names: core = 185.92.183.106 (main stack), hostvds = 95.182.96.28 (probe-only).
# A check with no `vantage` runs on core only. `vantage: [hostvds]` means core never runs it, so until the probe
# is deployed that check produces no results at all (and can neither open nor keep an incident open).

targets:
  - id: roco-client-portal
    name: client.rocobroker.ir (client portal)
    group: Roco Broker
    audience: roco
    host: 89.46.217.245
    tags: [roco, portal]
    checks:
      - kind: http
        vantage: [core, hostvds]
        config: { url: "https://client.rocobroker.ir/", keyword: "login" }
      - kind: tls
        config: { host: client.rocobroker.ir, port: 443 }
      - kind: domain
        config: { domain: rocobroker.ir }

  - id: roco-main-site
    name: rocobroker.com (main site)
    group: Roco Broker
    audience: roco
    host: 89.46.217.221
    tags: [roco, website]
    checks:
      - kind: http
        vantage: [core, hostvds]
        config: { url: "https://rocobroker.com/", expect_status: 200 }
      - kind: tls
        config: { host: rocobroker.com, port: 443 }
      - kind: domain
        config: { domain: rocobroker.com }
      - kind: dns
        config: { name: rocobroker.com, type: A }

  - id: roco-seo-agents
    name: roco-seo agents
    group: Roco Broker
    audience: roco
    host: 31.57.24.70
    tags: [roco, agents]
    note: |
      TODO (set at the end, once the API is exposed publicly): add http checks for
      GET /health (liveness, 200 if the API responds) and GET /ready (readiness, 200 when DB and queue are ready).
      Base URL not decided: https://scc.rocobroker.com is the Next.js frontend and returns 404 for both.
      Heartbeat: the scheduled jobs (daily GSC 04:15 UTC, GA4 04:45 UTC, weekly PageSpeed Mon 05:15 UTC) must POST
      the push URL after a successful run. Grace is 25 h so a late run is not an outage.
    checks:
      - kind: heartbeat
        config: { grace_s: 90000 }

  - id: roco-email
    name: Roco email (SPF/DKIM/DMARC, SMTP)
    group: Roco Broker
    audience: roco
    tags: [roco, email]
    note: LiquidWeb + providers. Expected DNS values and mail hostname to be confirmed.
    checks:
      - kind: dns
        config: { name: rocobroker.com, type: TXT, contains: "v=spf1" }
      - kind: dns
        config: { name: _dmarc.rocobroker.com, type: TXT, contains: "v=DMARC1" }
      - kind: smtp
        # Outbound 25/465/587 to mail.rocobroker.com all time out from the core VPS (verified 2026-11-01), so this
        # check can only ever pass from the second vantage. It produces no results until the probe is deployed.
        vantage: [hostvds]
        config: { host: mail.rocobroker.com, port: 465, secure: true }

  - id: termspace
    name: termspace.dev
    group: Personal & client projects
    audience: admin
    tags: [personal, nextjs]
    note: |
      Live at https://termspace.dev (VPS 31.57.92.100), moved off the retired sslip.io preview on 2026-11-01.
      Arabic (/ar) is not published yet and English (/en) currently 404s, so neither is checked on purpose.
      Re-add them when they return 200.
    checks:
      - kind: http
        config: { url: "https://termspace.dev/", keyword: "termspace" }
      - kind: http
        config: { url: "https://termspace.dev/fa" }
      - kind: tls
        config: { host: termspace.dev, port: 443 }

  - id: hostvds-vps
    name: HostVDS VPS
    group: Infrastructure
    audience: admin
    host: 95.182.96.28
    tags: [vps, debian, proxy]
    note: Checks nginx + TLS on the WebSocket path, not just the port (earlier nginx incident).
    checks:
      - kind: tcp
        config: { host: 95.182.96.28, port: 22 }
      - kind: agent
        config: { units: [nginx, xray] }

  - id: ubuntu-vps-shared
    name: Ubuntu VPS (shared)
    group: Infrastructure
    audience: roco
    tags: [vps, ubuntu, docker]
    note: Shared with teammate; host/IP to be confirmed.
    checks:
      - kind: agent
        config: { containers: true }

  - id: cpanel-alma
    name: AlmaLinux cPanel server
    group: Infrastructure
    audience: roco
    tags: [cpanel, almalinux]
    note: WHM on host1.rocobroker.com:2087 (same IP as mail.rocobroker.com).
    checks:
      - kind: http
        config: { url: "https://host1.rocobroker.com:2087/" }
      - kind: tls
        config: { host: host1.rocobroker.com, port: 2087 }

  - id: pulse-dashboard
    name: pulse.termspace.dev (this dashboard)
    group: Infrastructure
    audience: admin
    tags: [pulse, self]
    note: |
      Self-monitoring. The watchdog answers "is Pulse alive at all"; these checks catch what it cannot see --
      Caddy, DNS and certificate problems, and an app that starts answering wrong on its own domain.
    checks:
      - kind: json
        config: { url: "https://pulse.termspace.dev/api/healthz" }
      - kind: tls
        config: { host: pulse.termspace.dev, port: 443 }
