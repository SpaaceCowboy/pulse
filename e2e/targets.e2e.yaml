# Fixture-only registry for the Playwright run (never used outside e2e). Short intervals so a killed
# fixture turns the row red in seconds; the real targets.yaml is untouched.
targets:
  - id: e2e-roco-site
    name: E2E Roco Site
    group: Roco Broker
    audience: roco
    checks:
      - kind: http
        interval_s: 5
        timeout_ms: 2000
        config: { url: "http://127.0.0.1:4101/" }
  - id: e2e-shared-infra
    name: E2E Shared Infra
    group: Infrastructure
    audience: roco
    checks:
      - kind: http
        interval_s: 5
        timeout_ms: 2000
        config: { url: "http://127.0.0.1:4103/" }
  - id: e2e-admin-vps
    name: E2E Admin Secret Proxy
    group: Infrastructure
    audience: admin
    checks:
      - kind: http
        interval_s: 5
        timeout_ms: 2000
        config: { url: "http://127.0.0.1:4102/" }
